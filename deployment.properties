# CloudHub Deployment Configuration
# This file contains deployment properties for different environments

# Application Configuration
app.name=vibes-poc
app.runtime.version=4.4.0
app.worker.type=MICRO
app.workers=1
app.region=us-east-1

# Environment Variables for CloudHub
# Override these in CloudHub console for each environment

# Development Environment
dev.http.port=8081
dev.log.level=DEBUG
dev.app.environment=development

# Staging Environment  
staging.http.port=8081
staging.log.level=INFO
staging.app.environment=staging

# Production Environment
prod.http.port=8081
prod.log.level=WARN
prod.app.environment=production

# Security Configuration
# These should be set as secure properties in CloudHub
secure.jwt.secret=${secure::jwt.secret}
secure.db.password=${secure::db.password}

# External Service URLs
external.sentiment.api.url=https://api.sentimentanalysis.com
external.music.api.url=https://api.musicservice.com

# Rate Limiting (if using API Gateway)
rate.limit.requests.per.minute=1000
rate.limit.burst.size=100

# Monitoring and Alerting
monitoring.enabled=true
monitoring.endpoint=/health
monitoring.interval.seconds=30

# Logging Configuration for CloudHub
logging.level.com.mulesoft.poc=INFO
logging.level.org.mule=WARN
logging.level.org.springframework=ERROR

# Memory and Performance Tuning
jvm.memory.initial=512m
jvm.memory.max=1024m
jvm.gc.collector=G1GC